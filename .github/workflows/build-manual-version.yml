name: Build Manual Weapon Switch

on:
  push:
    branches:
      - manual-version
  pull_request:
    branches:
      - manual-version
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Checkout KenshiLib build dependencies
        uses: actions/checkout@v4
        with:
          repository: BFrizzleFoShizzle/KenshiLib_Examples_deps
          ref: master
          path: third_party/KenshiLib_deps
          lfs: true

      - name: Locate MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Prepare build environment
        shell: pwsh
        run: |
          $deps = Join-Path $env:GITHUB_WORKSPACE "third_party/KenshiLib_deps"
          $kenshiLib = Join-Path $deps "KenshiLib"
          $boost = Join-Path $deps "boost_1_60_0"

          if (!(Test-Path (Join-Path $kenshiLib "Include"))) {
            throw "KenshiLib Include directory was not found."
          }

          if (!(Test-Path (Join-Path $kenshiLib "Libraries"))) {
            throw "KenshiLib Libraries directory was not found."
          }

          if (!(Test-Path $boost)) {
            throw "Boost 1.60.0 directory was not found."
          }

          "KENSHILIB_DIR=$kenshiLib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BOOST_INCLUDE_PATH=$boost" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Release x64
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE "build\\"
          msbuild .\\AdaptiveWeaponTactics.vcxproj `
            /m `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:PlatformToolset=v143 `
            /p:OutDir="$out"

      - name: Verify DLL
        shell: pwsh
        run: |
          $dll = Join-Path $env:GITHUB_WORKSPACE "build\\AdaptiveWeaponTactics.dll"
          if (!(Test-Path $dll)) {
            throw "Build completed without producing AdaptiveWeaponTactics.dll"
          }
          Get-Item $dll | Format-List FullName,Length,LastWriteTime

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdaptiveWeaponTactics-manual-version
          path: build/AdaptiveWeaponTactics.dll
          if-no-files-found: error
